<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FORGECRAFT — 3D Character Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{--bg:#101114;--panel:#191b20;--line:#30343d;--text:#f2f0eb;--muted:#989da8;--gold:#f0a34a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}button,select,input{font:inherit}button{cursor:pointer}
.app{height:100vh;min-height:620px;display:grid;grid-template-rows:64px 1fr}header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:#141519}.brand{display:flex;align-items:center;gap:12px}.logo{border:1px solid var(--gold);color:var(--gold);padding:5px;font-size:22px;transform:rotate(45deg)}.logo span{display:block;transform:rotate(-45deg)}h1{font:800 22px 'Barlow Condensed',sans-serif;letter-spacing:2px;margin:0}.sub{font-size:9px;color:var(--muted);letter-spacing:2px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#202229;color:#eee;padding:10px 12px;border-radius:5px;font-size:11px}.primary{background:var(--gold);border-color:var(--gold);color:#21170c;font-weight:800}
.workspace{display:grid;grid-template-columns:220px minmax(280px,1fr) 260px;min-height:0}.panel{background:var(--panel);overflow:auto;padding:16px}.panel.left{border-right:1px solid var(--line)}.panel.right{border-left:1px solid var(--line)}.eyebrow{color:var(--gold);font-size:9px;letter-spacing:2px;font-weight:800}.panel h2{font:700 23px 'Barlow Condensed',sans-serif;margin:5px 0 16px}.label{font-size:10px;color:var(--muted);letter-spacing:1.5px;margin:18px 0 9px}.tab{width:100%;text-align:left;background:transparent;border:1px solid transparent;color:#c5c7cf;padding:11px;border-radius:5px;margin:2px 0}.tab.active,.tab:hover{background:#2a251f;border-color:#604a31;color:#ffd28e}.tip{font-size:11px;line-height:1.6;color:#bcb5aa;border:1px solid #3a332a;background:#211e1a;padding:12px;margin-top:22px;border-radius:5px}.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#292b30,#141519 78%)}#view{display:block;width:100%;height:100%;outline:none}.stageTop,.stageBottom{position:absolute;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.stageTop{top:18px}.stageBottom{bottom:20px;align-items:end}.badge{font-size:9px;letter-spacing:1.5px;color:#c7c9d0;background:#17191dcc;border:1px solid #3a3d45;border-radius:4px;padding:9px 11px}.badge b{color:#ffd28e}.heroName{font:800 30px 'Barlow Condensed',sans-serif;letter-spacing:1px}.field{margin:16px 0}.field label,.fieldTop{display:block;font-size:11px;color:#d8d9dd;margin-bottom:8px}.field select,.field input[type=text]{width:100%;background:#111216;color:#eee;border:1px solid #383b44;border-radius:5px;padding:10px;font-size:11px}.swatches{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:27px;height:27px;border:2px solid #555a64;border-radius:50%;outline:2px solid transparent;outline-offset:2px}.swatch.active{outline-color:var(--gold);border-color:white}.toggle{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #2e3037;font-size:11px;color:#ddd}.toggle input{accent-color:var(--gold)}input[type=range]{width:100%;accent-color:var(--gold)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.grid2 button{padding:10px 4px}.notice{position:absolute;top:65px;left:50%;transform:translateX(-50%);padding:10px 14px;background:#22251f;border:1px solid #5b6b47;border-radius:5px;font-size:11px;opacity:0;pointer-events:none}.notice.show{opacity:1}
@media(max-width:800px){.app{height:auto;min-height:100vh;grid-template-rows:60px auto}.workspace{grid-template-columns:170px 1fr;grid-template-rows:65vh auto}.stage{grid-column:1/-1;grid-row:1}.left{grid-row:2}.right{grid-row:2;border-left:1px solid var(--line)}.actions .btn:not(.primary){display:none}}
@media(max-width:520px){.workspace{grid-template-columns:1fr;grid-template-rows:55vh auto auto}.stage{grid-row:1}.left{grid-row:2;border-right:0;border-bottom:1px solid var(--line)}.right{grid-row:3;border-left:0}.left nav{display:grid;grid-template-columns:repeat(3,1fr)}.tab{text-align:center;padding:9px 3px;font-size:10px}.tip{display:none}h1{font-size:18px}}
</style>
</head>
<body><div class="app">
<header><div class="brand"><div class="logo"><span>⚒</span></div><div><h1>FORGECRAFT</h1><div class="sub">3D CHARACTER STUDIO</div></div></div><div class="actions"><button class="btn" id="reset">↺ Reset</button><button class="btn" id="save">▣ Save</button><button class="btn primary" id="export">↓ Export PNG</button></div></header>
<div class="workspace">
<aside class="panel left"><div class="eyebrow">WORKSHOP / 01</div><h2>BUILD YOUR HERO</h2><div class="label">CUSTOMIZATION</div><nav><button class="tab active" data-tab="body">♟ Body</button><button class="tab" data-tab="armor">🛡 Armor</button><button class="tab" data-tab="weapon">⚔ Weapons</button><button class="tab" data-tab="head">♙ Head & Hair</button><button class="tab" data-tab="magic">✦ Magic</button><button class="tab" data-tab="scene">◈ Display</button></nav><div class="tip"><b>WORKSHOP TIP</b><br>Drag to rotate around your hero. Scroll to zoom. Choices update the model instantly.</div></aside>
<main class="stage"><canvas id="view" aria-label="Interactive 3D character preview"></canvas><div class="stageTop"><div class="badge">PREVIEW MODE <b>● LIVE</b></div><div><button class="btn" id="front">Front</button> <button class="btn" id="spin">⟳</button></div></div><div class="stageBottom"><div><div class="heroName" id="heroName">ASHEN WARDEN</div><div class="sub">CUSTOM MINIATURE · <span id="raceLabel">HUMAN</span></div></div><div class="badge">VIEW <b>01</b> / 3D</div></div><div class="notice" id="notice">Saved!</div></main>
<aside class="panel right"><div class="eyebrow">CHARACTER SHEET / 02</div><h2>DETAILS & MATERIALS</h2><div id="controls"></div></aside>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const canvas=document.querySelector('#view'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#17191f');const camera=new THREE.PerspectiveCamera(35,1,.1,100);camera.position.set(5,3.5,8);const orbit=new OrbitControls(camera,canvas);orbit.target.set(0,1.6,0);orbit.enableDamping=true;orbit.minDistance=4;orbit.maxDistance=13;
scene.add(new THREE.HemisphereLight(0xe2e9ff,0x45362a,2));const key=new THREE.DirectionalLight(0xffe0b5,3);key.position.set(4,8,5);key.castShadow=true;scene.add(key);const rim=new THREE.DirectionalLight(0x719aff,2);rim.position.set(-5,4,-4);scene.add(rim);
const floorMat=new THREE.MeshStandardMaterial({color:'#282a30',roughness:.8});const floor=new THREE.Mesh(new THREE.CircleGeometry(4,64),floorMat);floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);const grid=new THREE.GridHelper(8,32,'#55545a','#373940');grid.position.y=-.025;scene.add(grid);
const state={name:'ASHEN WARDEN',race:'Human',skin:'#b87955',armor:'#343946',accent:'#c58a43',hair:'#29252a',weapon:'Longsword',helmet:'Open helm',chest:true,shoulders:true,cape:true,glow:false,scale:1,background:'Workshop',pose:'Heroic'};
let hero=new THREE.Group(),spinning=false;scene.add(hero);
const mat=(c,metal=0,rough=.5,extra={})=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough,...extra});
function add(g,geo,m,p,s){const o=new THREE.Mesh(geo,m);o.position.set(...p);if(s)o.scale.set(...s);o.castShadow=true;o.receiveShadow=true;g.add(o);return o}
function ball(g,m,p,s){return add(g,new THREE.SphereGeometry(1,24,16),m,p,s)}
function box(g,m,p,s){return add(g,new THREE.BoxGeometry(...s),m,p)}
function cyl(g,m,p,r1,r2,h){return add(g,new THREE.CylinderGeometry(r1,r2,h,12),m,p)}
function build(){scene.remove(hero);hero=new THREE.Group();scene.add(hero);hero.scale.setScalar(state.scale);const skin=mat(state.skin),armor=mat(state.armor,.55,.35),trim=mat(state.accent,.75,.25),hair=mat(state.hair),leather=mat('#3b2922'),steel=mat('#d5d9e2',.85,.2);
const orc=state.race==='Orc',elf=state.race==='Elf';ball(hero,skin,[0,2.35,0],[orc?.48:.36,.43,.33]);ball(hero,skin,[0,1.48,0],[.45,.62,.28]);ball(hero,armor,[0,1.62,0],[.5,.53,.3]);if(state.chest)box(hero,armor,[0,1.83,.02],[.68,.5,.36]);if(state.cape){const c=add(hero,new THREE.ConeGeometry(.48,1,4),mat(state.accent,.15,.6,{side:THREE.DoubleSide}),[0,1.52,-.28]);c.rotation.x=Math.PI}
ball(hero,hair,[0,2.61,-.02],[.37,.22,.34]);if(elf){const e=mat(state.skin);const l=add(hero,new THREE.ConeGeometry(.11,.35,12),e,[-.35,2.39,0]);l.rotation.z=Math.PI/2;const r=l.clone();r.position.x=.35;r.rotation.z=-Math.PI/2;hero.add(r)}if(orc){const tusk=mat('#eee0bd');add(hero,new THREE.ConeGeometry(.07,.23,10),tusk,[-.2,2.15,.27]);add(hero,new THREE.ConeGeometry(.07,.23,10),tusk,[.2,2.15,.27])}
if(state.helmet!=='None'){if(state.helmet==='Hood')ball(hero,leather,[0,2.55,-.04],[.43,.35,.38]);else if(state.helmet==='Crown'){cyl(hero,trim,[0,2.72,0],.27,.27,.12);for(let i=0;i<5;i++)add(hero,new THREE.ConeGeometry(.045,.17,8),trim,[-.22+i*.11,2.84,0])}else{ball(hero,armor,[0,2.57,0],[.4,.27,.35]);if(state.helmet==='Open helm')box(hero,skin,[0,2.47,.29],[.27,.14,.07]);else box(hero,armor,[0,2.39,.29],[.33,.2,.1])}}
for(const side of [-1,1]){const arm=ball(hero,armor,[side*.55,1.72,0],[.18,.46,.18]);arm.rotation.z=side*-.2;cyl(hero,leather,[side*.58,1.31,.03],.13,.15,.3);ball(hero,skin,[side*.58,1.12,.04],[.14,.14,.14]);box(hero,armor,[side*.22,.78,0],[.25,.65,.27]);box(hero,leather,[side*.22,.32,.03],[.23,.25,.25]);if(state.shoulders)ball(hero,trim,[side*.55,2.02,0],[.26,.2,.24])}
if(state.weapon==='Longsword'||state.weapon==='Dagger'||state.weapon==='Axe'){const x=.67;box(hero,leather,[x,1.48,.15],[.09,.34,.09]);box(hero,trim,[x,1.68,.15],[.28,.05,.1]);if(state.weapon==='Axe'){box(hero,steel,[x+.13,1.92,.15],[.32,.35,.08])}else box(hero,steel,[x,2.1,.15],[state.weapon==='Dagger'?.07:.11,state.weapon==='Dagger'?.38:.75,.045])}else if(state.weapon==='Staff'){cyl(hero,leather,[.7,1.8,.1],.04,.04,1.55);ball(hero,mat('#7c9cff',.2,.2,{emissive:'#315bff',emissiveIntensity:1}),[.7,2.62,.1],[.13,.13,.13])}else if(state.weapon==='Bow'){const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(.65,1.3,.1),new THREE.Vector3(.98,1.8,.1),new THREE.Vector3(.65,2.3,.1));add(hero,new THREE.TubeGeometry(curve,20,.035,8,false),trim,[0,0,0]);}else{ball(hero,trim,[-.68,1.85,.12],[.25,.34,.09]);ball(hero,armor,[-.68,1.85,.18],[.19,.27,.04])}
if(state.glow){hero.add(new THREE.PointLight(0x7196ff,12,4));ball(hero,mat('#8bb8ff',.1,.15,{emissive:'#315bff',emissiveIntensity:2}),[0,2.9,.25],[.08,.08,.08])}if(state.pose==='Battle'){hero.rotation.z=.06;hero.rotation.y=.14}document.querySelector('#heroName').textContent=state.name;document.querySelector('#raceLabel').textContent=state.race.toUpperCase();const bg={Workshop:['#17191f','#282a30'],Midnight:['#09101e','#17233a'],Ember:['#1c1210','#38251d']}[state.background];scene.background=new THREE.Color(bg[0]);floorMat.color.set(bg[1]);grid.visible=state.background==='Workshop'}
const tabs={body:{title:'BODY & BUILD',desc:'Choose the foundation of your adventurer.',fields:[['select','race','Character type',['Human','Elf','Orc']],['range','scale','Miniature scale',[.85,1.15,.01]],['swatches','skin','Skin tone',['#b87955','#e0b18b','#8a573d','#6d493d','#8c9b68','#d5c6aa']]]},armor:{title:'ARMOR & CLOTHING',desc:'Shape your silhouette and materials.',fields:[['swatches','armor','Armor material',['#343946','#626975','#6d4035','#3e584e','#b2a58a','#29232f']],['swatches','accent','Trim & metal',['#c58a43','#c8cbd1','#9d493c','#668f86','#b5a0d7','#d4bd75']],['toggle','chest','Chest armor'],['toggle','shoulders','Shoulder plates'],['toggle','cape','Heroic cape']]},weapon:{title:'ARSENAL',desc:'Equip your signature weapon.',fields:[['select','weapon','Main-hand equipment',['Longsword','Axe','Staff','Bow','Dagger','Sword & Shield']]]},head:{title:'HEAD & HAIR',desc:'Choose headgear and hair color.',fields:[['select','helmet','Headgear',['Open helm','Full helm','Hood','Crown','None']],['swatches','hair','Hair color',['#29252a','#5a3928','#a77a43','#d0c5b3','#9c3936','#eeeeee']]]},magic:{title:'MAGIC & EFFECTS',desc:'Add supernatural energy.',fields:[['toggle','glow','Arcane glow']]},scene:{title:'PRESENTATION',desc:'Prepare your miniature for the showcase.',fields:[['select','background','Studio environment',['Workshop','Midnight','Ember']],['select','pose','Pose preset',['Heroic','Battle']],['text','name','Character name']]}}
function renderTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const t=tabs[tab],root=document.querySelector('#controls');root.innerHTML='<h3>'+t.title+'</h3><p style="font-size:11px;line-height:1.5;color:var(--muted)">'+t.desc+'</p>';for(const f of t.fields){const [type,key,label,opts]=f,w=document.createElement('div');w.className='field';if(type==='select')w.innerHTML='<label>'+label+'</label><select data-key="'+key+'">'+opts.map(v=>'<option '+(state[key]===v?'selected':'')+'>'+v+'</option>').join('')+'</select>';if(type==='range')w.innerHTML='<label>'+label+' <b>'+Math.round(state[key]*100)+'%</b></label><input data-key="'+key+'" type="range" min="'+opts[0]+'" max="'+opts[1]+'" step="'+opts[2]+'" value="'+state[key]+'">';if(type==='swatches')w.innerHTML='<label>'+label+'</label><div class="swatches">'+opts.map(c=>'<button class="swatch '+(state[key]===c?'active':'')+'" data-key="'+key+'" data-value="'+c+'" style="background:'+c+'" aria-label="'+c+'"></button>').join('')+'</div>';if(type==='toggle')w.innerHTML='<label class="toggle">'+label+'<input type="checkbox" data-key="'+key+'" '+(state[key]?'checked':'')+'></label>';if(type==='text')w.innerHTML='<label>'+label+'</label><input type="text" data-key="'+key+'" value="'+state[key]+'">';root.appendChild(w)}const actions=document.createElement('div');actions.className='grid2';actions.innerHTML='<button class="btn" id="random">✦ Randomize</button><button class="btn primary" id="save2">▣ Save Build</button>';root.appendChild(actions);root.querySelectorAll('[data-key]').forEach(el=>{const event=el.type==='checkbox'||el.tagName==='SELECT'?'change':'input';el.addEventListener(event,()=>{const k=el.dataset.key;state[k]=el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value;build();if(el.tagName==='SELECT'||el.classList.contains('swatch'))renderTab(tab)})});root.querySelectorAll('.swatch').forEach(el=>el.addEventListener('click',()=>{state[el.dataset.key]=el.dataset.value;build();renderTab(tab)}));document.querySelector('#random').onclick=randomize;document.querySelector('#save2').onclick=save}
function note(s){const n=document.querySelector('#notice');n.textContent=s;n.classList.add('show');setTimeout(()=>n.classList.remove('show'),1600)}
function save(){localStorage.setItem('forgecraft-save',JSON.stringify(state));note('Character saved in this browser.')}
function randomize(){const pick=a=>a[Math.floor(Math.random()*a.length)];state.race=pick(['Human','Elf','Orc']);state.skin=pick(tabs.body.fields[2][3]);state.armor=pick(tabs.armor.fields[0][3]);state.accent=pick(tabs.armor.fields[1][3]);state.hair=pick(tabs.head.fields[1][3]);state.weapon=pick(tabs.weapon.fields[0][3]);state.helmet=pick(tabs.head.fields[0][3]);state.cape=Math.random()>.25;state.chest=Math.random()>.15;state.shoulders=Math.random()>.3;state.glow=Math.random()>.55;build();renderTab(document.querySelector('.tab.active')?.dataset.tab||'body');note('A new hero has entered the workshop!')}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>renderTab(b.dataset.tab));document.querySelector('#save').onclick=save;document.querySelector('#reset').onclick=()=>{Object.assign(state,{name:'ASHEN WARDEN',race:'Human',skin:'#b87955',armor:'#343946',accent:'#c58a43',hair:'#29252a',weapon:'Longsword',helmet:'Open helm',chest:true,shoulders:true,cape:true,glow:false,scale:1,pose:'Heroic',background:'Workshop'});build();renderTab('body');note('Workshop reset.')};document.querySelector('#export').onclick=()=>{renderer.render(scene,camera);const a=document.createElement('a');a.download='forgecraft-hero.png';a.href=renderer.domElement.toDataURL('image/png');a.click();note('PNG exported.')};document.querySelector('#front').onclick=()=>{camera.position.set(0,3.2,8);orbit.target.set(0,1.6,0);orbit.update()};document.querySelector('#spin').onclick=()=>{spinning=!spinning;note(spinning?'Auto-rotation enabled':'Auto-rotation paused')};const saved=localStorage.getItem('forgecraft-save');if(saved)try{Object.assign(state,JSON.parse(saved))}catch{}renderTab('body');build();function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(canvas);function animate(){requestAnimationFrame(animate);if(spinning)hero.rotation.y+=.005;orbit.update();renderer.render(scene,camera)}animate();
</script></body></html>
